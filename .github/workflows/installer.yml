name: Installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - run: python3 -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
